name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    # Windows はベストエフォート対象のため、そこでの失敗が
    # ワークフロー実行全体を失敗させないようにする。
    continue-on-error: ${{ matrix.os == 'windows-latest' }}

    strategy:
      # OS 固有の失敗か全 OS で起きる失敗かを1回の実行で切り分けたいため、
      # 1ジョブの失敗で残りをキャンセルしない。
      fail-fast: false
      matrix:
        # Node はサポート下限の系列と最新の両端のみを検証する。
        # 中間の 24 は両端が通れば壊れる余地がほぼないため省いている。
        # 22 は常に最新の 22.x に解決されるため engines の下限
        # (22.12) そのものを踏むわけではない点に注意。
        # macOS は第一の想定実行環境だが、Node の両端検証は ubuntu が担うため
        # 代表 1 バージョン（最新側）に絞っている。
        # Windows は回帰を気づかないまま溜めないよう代表 1 ジョブだけ
        # 観測用に置き、全体を 4 ジョブに収めている。
        include:
          - os: ubuntu-latest
            node-version: 22
          - os: ubuntu-latest
            node-version: 26
          - os: macos-latest
            node-version: 26
          - os: windows-latest
            node-version: 26

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build
