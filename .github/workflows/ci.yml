name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    # Windows はベストエフォート対象のため、そこでの失敗が
    # ワークフロー実行全体を失敗させないようにする。
    continue-on-error: ${{ matrix.os == 'windows-latest' }}

    strategy:
      # OS 固有の失敗か全 OS で起きる失敗かを1回の実行で切り分けたいため、
      # 1ジョブの失敗で残りをキャンセルしない。
      fail-fast: false
      matrix:
        # Node はサポート下限の系列 (24) と最新 (26) の両端を検証する。
        # 22 は engines (>=24.14) を満たさないが、engines は実行を止めない
        # （pnpm 10.30.1 で実測: 警告のみ exit 0）ため、下限未満の Node でも
        # 起動はする。このジョブが確かめるのは、install・lint・typecheck・test・
        # build が Node 22 でも通ること、すなわち下限未満で即座に壊れる構文や
        # API をソースに持ち込んでいないことだけ。setGlobalProxyFromEnv が
        # 実際に無い状態の挙動は、テストが node:http をモックするため検証できない。
        # 24 は常に最新の 24.x に解決されるため engines の下限
        # (24.14) そのものを踏むわけではない点に注意。
        # macOS は第一の想定実行環境だが、Node の両端検証は ubuntu が担うため
        # 代表 1 バージョン（最新側）に絞っている。
        # Windows は回帰を気づかないまま溜めないよう代表 1 ジョブだけ
        # 観測用に置いている。
        include:
          - os: ubuntu-latest
            node-version: 22
          - os: ubuntu-latest
            node-version: 24
          - os: ubuntu-latest
            node-version: 26
          - os: macos-latest
            node-version: 26
          - os: windows-latest
            node-version: 26

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build
